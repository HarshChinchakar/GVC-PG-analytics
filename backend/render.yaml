# Render deployment. Free tier: 512 MB RAM, and the instance sleeps when idle.
services:
  - type: web
    name: pg-portal-api
    runtime: python
    plan: free
    region: singapore          # closest to the Supabase ap-northeast-2 pooler
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Set these in the Render dashboard, never in this file.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
    # --workers 1 is deliberate: the login throttle keeps its state in process
    # memory, so a second worker would each get their own counter and halve the
    # effective lockout. One worker is also all a 512 MB instance should run.
